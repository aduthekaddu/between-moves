# pnpm refuses to run on a Node outside engines.node in package.json. Without this it only warns.
engineStrict: true
packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  ws@8: 8.21.3
  engine.io@6: 6.6.11
  nanoid@3: 3.3.18
  brace-expansion@1: 1.1.21
  brace-expansion@5: 5.0.12
  source-map-js: 1.2.2
  sharp: 0.35.5
  systeminformation: 5.33.19
  vite@8: 8.3.5
  happy-dom: 21.0.4
  zod@4: 4.6.7
# GHSA-mrhx-c7xc-m3w5 is a Zod 4 array-parser bug. Zod 4 is pinned to 4.6.7.
# The advisory range also matches Zod 3.25.76 inside Trigger.dev 4.5.6, which does not contain that parser.
auditConfig:
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5
allowBuilds:
  esbuild: true
  protobufjs: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@next/env@16.4.4'
  - '@next/eslint-plugin-next@16.4.4'
  - '@next/swc-darwin-arm64@16.4.4'
  - '@next/swc-darwin-x64@16.4.4'
  - '@next/swc-linux-arm64-gnu@16.4.4'
  - '@next/swc-linux-arm64-musl@16.4.4'
  - '@next/swc-linux-x64-gnu@16.4.4'
  - '@next/swc-linux-x64-musl@16.4.4'
  - '@next/swc-win32-arm64-msvc@16.4.4'
  - '@next/swc-win32-x64-msvc@16.4.4'
  - eslint-config-next@16.4.4
  - next@16.4.4
