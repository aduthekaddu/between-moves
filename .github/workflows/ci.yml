name: CI

# [BM-051:AC-3] Security jobs fail PR CI on findings or unmapped criteria.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm audit --audit-level high

  secret-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  sast-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan high-severity code findings
        run: |
          python -m pip install 'semgrep==1.136.0' 'setuptools<81'
          semgrep scan --config p/owasp-top-ten --severity ERROR --error

  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm traceability:check

  formal-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The key hashes the script, which pins the TLC version and the jar SHA-256.
      # The script re-checks the SHA-256, so a stale cache costs a download, not a wrong jar.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/between-moves/tla2tools
          key: tla2tools-${{ hashFiles('tooling/formal-check.mjs') }}
      - name: Prove the runner can fail
        run: pnpm formal:selftest
      - name: Check formal models
        run: pnpm formal:check

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret scan baseline
        shell: bash
        run: |
          if git grep -n -I -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}' -- \
            ':!pnpm-lock.yaml' ':!.github/workflows/ci.yml'; then
            echo '::error::Potential committed secret detected'
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  database-integration:
    needs: quality
    # Playwright 1.55.1 has no Chromium build for ubuntu-latest once that image is 26.04.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_DB: between_moves_test
          POSTGRES_PASSWORD: postgres-test-only
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d between_moves_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable PostgreSQL TLS and create runtime role
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          PGPASSWORD: postgres-test-only
        run: |
          openssl req -new -x509 -nodes -days 1 -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout /tmp/postgres-server.key -out /tmp/postgres-server.crt
          docker cp /tmp/postgres-server.key "$POSTGRES_CONTAINER:/var/lib/postgresql/data/server.key"
          docker cp /tmp/postgres-server.crt "$POSTGRES_CONTAINER:/var/lib/postgresql/data/server.crt"
          docker exec --user root "$POSTGRES_CONTAINER" sh -c \
            'chown postgres:postgres /var/lib/postgresql/data/server.* && chmod 600 /var/lib/postgresql/data/server.key'
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d between_moves_test -v ON_ERROR_STOP=1 \
            -c "alter system set ssl = 'on'" \
            -c "alter system set ssl_cert_file = 'server.crt'" \
            -c "alter system set ssl_key_file = 'server.key'"
          docker restart "$POSTGRES_CONTAINER"
          until docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres -d between_moves_test; do sleep 1; done
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d between_moves_test -v ON_ERROR_STOP=1 -c \
            "create role between_moves_app login password 'runtime-test-only'; revoke create on schema public from public; grant connect on database between_moves_test to between_moves_app; grant usage on schema public to between_moves_app;"

      - name: PostgreSQL migration and round-trip integration tests
        env:
          NODE_EXTRA_CA_CERTS: /tmp/postgres-server.crt
          TEST_DATABASE_URL: postgresql://postgres:postgres-test-only@127.0.0.1:5432/between_moves_test?sslmode=require
        run: pnpm --filter @between-moves/db test

      - name: Better Auth PostgreSQL integration tests
        env:
          NODE_EXTRA_CA_CERTS: /tmp/postgres-server.crt
          TEST_DATABASE_URL: postgresql://postgres:postgres-test-only@127.0.0.1:5432/between_moves_test?sslmode=require
        run: pnpm --filter @between-moves/web test

      - name: Prepare migrated database for end-to-end auth
        env:
          DATABASE_URL: postgresql://postgres:postgres-test-only@127.0.0.1:5432/between_moves_test?sslmode=require
          NODE_EXTRA_CA_CERTS: /tmp/postgres-server.crt
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          pnpm db:migrate
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d between_moves_test -v ON_ERROR_STOP=1 \
            -c "grant select, insert, update, delete on all tables in schema public to between_moves_app"

      - name: Install Playwright Chromium
        run: pnpm --filter @between-moves/web exec playwright install --with-deps chromium

      - name: End-to-end test with database readiness
        env:
          DATABASE_URL: postgresql://between_moves_app:runtime-test-only@127.0.0.1:5432/between_moves_test?sslmode=require
          TEST_DATABASE_URL: postgresql://postgres:postgres-test-only@127.0.0.1:5432/between_moves_test?sslmode=require
          NODE_EXTRA_CA_CERTS: /tmp/postgres-server.crt
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30
